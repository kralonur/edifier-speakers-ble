# Strict typing check, as the integration quality scale asks for.
#
# Home Assistant ships type information (py.typed), so this component is checked
# against Home Assistant's own types rather than against stubs. Both the
# integration and Home Assistant must be importable, which is the case inside the
# Home Assistant container:
#
#   PYTHONPATH=$PWD:/usr/src/homeassistant python3 -m mypy
#
# `follow_imports = silent` keeps mypy from reporting the errors of the modules it
# reads for types (Home Assistant itself); the files listed below are still
# checked in full.

[mypy]
strict = True
follow_imports = silent
files = custom_components/edifier_ble
