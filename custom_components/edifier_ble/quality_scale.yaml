# Implementation status against the Home Assistant integration quality scale.
#
# This is a custom integration, which Home Assistant does not grade, so this file
# records an honest self-assessment rather than a claimed tier: `done` for rules we
# meet, `exempt` where a rule cannot apply, and `todo` where we knowingly do not
# meet it. Do not read a tier into it.
#
# Reference: https://developers.home-assistant.io/docs/core/integration-quality-scale/

rules:
  # --- Bronze -----------------------------------------------------------------
  action-setup:
    status: exempt
    comment: The rule is about where service actions are registered; this integration registers none.
  appropriate-polling:
    status: done
    comment: One state read every two minutes; commands and speaker notifications refresh immediately.
  brands:
    status: todo
    comment: Home Assistant serves brand images from custom_components/edifier_ble/brand/ (components/brands reads that directory for custom integrations), so this is achievable; the assets are not created yet.
  common-modules:
    status: done
    comment: Protocol framing, device session handling and Bluetooth plumbing live in protocol/ and bluetooth_device.py.
  config-flow:
    status: done
    comment: The single field carries a data_description, and the address plus the GATT-confirmed model live in ConfigEntry.data with no options used.
  config-flow-test-coverage:
    status: done
    comment: config_flow.py is at 100% statement coverage; tests cover the confirmation form both ways, a device without the Edifier profile, a connection error followed by a successful retry, an address that is not advertising, and the uniqueness guard.
  dependency-transparency:
    status: done
    comment: No requirements of its own. bleak and bleak-retry-connector come pinned from Home Assistant's bluetooth integration (4.7.0), which bluetooth_adapters depends on.
  docs-actions:
    status: exempt
    comment: The rule documents service actions an integration provides; this one provides none.
  docs-conditions:
    status: exempt
    comment: The rule documents conditions an integration provides; this one provides none.
  docs-high-level-description:
    status: done
    comment: The README opens the integration section with what Edifier BLE is, which speakers it covers and a link to the manufacturer.
  docs-installation-instructions:
    status: done
    comment: The README states the prerequisites (working Bluetooth, connectable adapter or proxy, speaker powered on) before the copy-restart-add steps.
  docs-removal-instructions:
    status: done
  docs-triggers:
    status: exempt
    comment: The rule documents triggers an integration provides; this one provides none.
  entity-event-setup:
    status: done
    comment: The speaker's unsolicited notifications are subscribed once per config entry by the coordinator, not per entity.
  entity-unique-id:
    status: done
  has-entity-name:
    status: done
  runtime-data:
    status: done
  test-before-configure:
    status: done
    comment: The config flow reads the speaker over GATT and only then creates the entry.
  test-before-setup:
    status: todo
    comment: >-
      Deliberate deviation, explained in the README. Setup does check the environment (no
      connectable adapter or proxy raises a translated ConfigEntryNotReady) and the config flow
      confirms the model over GATT before an entry exists, but setup does not require the
      speaker to answer. These speakers are unreachable whenever they are in standby - an M60
      with a closed Classic link will not even accept a BLE connection - so raising
      ConfigEntryNotReady would leave every entity missing on each restart instead of reporting
      Online off. Core integrations that do verify (led_ble, gardena_bluetooth, airthings_ble,
      switchbot) can afford it because their devices stay reachable.
  unique-config-entry:
    status: done

  # --- Silver -----------------------------------------------------------------
  action-exceptions:
    status: exempt
    comment: The integration provides no service actions.
  config-entry-unloading:
    status: done
  docs-configuration-parameters:
    status: done
  docs-installation-parameters:
    status: done
  entity-unavailable:
    status: exempt
    comment: Speakers sleep, and a command or Force connect wakes them, so entities keep their last known value and a dedicated Online sensor reports reachability.
  integration-owner:
    status: done
  log-when-unavailable:
    status: done
    comment: The coordinator logs the first failure and the recovery only.
  parallel-updates:
    status: done
    comment: 0 on the read-only platforms (the coordinator centralises reads) and 1 on every platform with actions, because the speaker accepts one BLE operation at a time.
  reauthentication-flow:
    status: exempt
    comment: Bluetooth pairing is out of scope; there are no credentials to reauthenticate.
  test-coverage:
    status: done
    comment: Statement coverage 100% and branch coverage 99% across the integration modules, measured with coverage inside the Home Assistant container (100 tests, no hardware).

  # --- Gold -------------------------------------------------------------------
  devices:
    status: done
  diagnostics:
    status: done
  discovery:
    status: done
    comment: Bluetooth discovery by advertised name and by ConneX service UUID.
  discovery-update-info:
    status: exempt
    comment: The Bluetooth address is the device identity; there is no network information to update from discovery.
  docs-data-update:
    status: done
  docs-examples:
    status: done
  docs-known-limitations:
    status: done
  docs-supported-devices:
    status: done
  docs-supported-functions:
    status: done
  docs-troubleshooting:
    status: done
  docs-use-cases:
    status: done
  dynamic-devices:
    status: exempt
    comment: A config entry represents one physically present speaker.
  entity-category:
    status: done
  entity-device-class:
    status: done
  entity-disabled-by-default:
    status: todo
    comment: Nothing is disabled by default. The deliberately noisy entities (Online, Bluetooth control link) are the ones the integration exists to expose, and the rest change only when the user or the speaker changes a setting; disabling any of them would hide them until a user enables them.
  entity-translations:
    status: todo
    comment: Entity names are plain strings, so they are not translatable. Adding translation keys would rename all 61 existing entities, which changes entity IDs.
  exception-translations:
    status: done
    comment: Every user-facing error is raised with a translation key and placeholders (no_connectable_adapter, link_command_failed, disruptive_command_failed, playback_command_failed, change_failed, change_not_applied), defined in strings.json and translations/en.json. A test asserts each key is defined, used and fed with the placeholders its message uses.
  icon-translations:
    status: todo
    comment: Depends on entity translations; icons.json is keyed by translation key.
  reconfiguration-flow:
    status: exempt
    comment: The rule exempts integrations without settings in their configuration flow, which is this one; the Bluetooth address is the device identity and there is nothing else to configure. No core BLE integration implements one either (switchbot, led_ble, gardena_bluetooth, airthings_ble, yalexs_ble, thermopro, xiaomi_ble).
  repair-issues:
    status: todo
    comment: Failures are logged and surfaced through the Online and Bluetooth control link sensors instead of repair issues.
  stale-devices:
    status: exempt
    comment: A speaker's device entry is removed with its config entry.

  # --- Platinum ---------------------------------------------------------------
  async-dependency:
    status: done
    comment: bleak and bleak-retry-connector are asynchronous.
  inject-websession:
    status: exempt
    comment: The integration does not talk HTTP.
  strict-typing:
    status: done
    comment: mypy --strict passes with 0 errors across the integration (mypy.ini; Home Assistant's own types via py.typed, follow_imports=silent so only this component is reported on). The mock-heavy tests are not part of the check.
